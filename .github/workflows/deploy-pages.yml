name: Publicera SynAct-sidan
on:
  # Token-authored quote commits do not trigger push workflows.
  # workflow_run publishes the newest data/stock_quote.json after each successful quote refresh.
  workflow_run:
    workflows: ["Uppdatera SynAct-aktiekurs och Fenja-utrymme"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'layout/**'
      - 'scripts/render_layout.py'
      - 'data/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render common layout and section links
        run: python3 scripts/render_layout.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
