name: Sammanfatta veckans nyheter
on:
  schedule:
    # 09:00 Stockholm: 08 UTC vintertid, 07 UTC sommartid.
    # Kör båda UTC-tiderna och låt skriptet avstå utanför 09 svensk tid.
    - cron: '0 7,8 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_weekly_news.py'
      - 'tests/test_weekly_news.py'
      - 'data/weekly_event_details.json'
      - '.github/workflows/weekly-news.yml'
permissions:
  contents: write
concurrency:
  group: synact-weekly-news
  cancel-in-progress: false
jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testa kod och vecka/arkivlogik
        run: |
          python -m py_compile scripts/update_weekly_news.py
          python -m unittest discover -s tests -p 'test_weekly_news.py'
      - name: Uppdatera innevarande vecka dagligen och behåll arkivet
        run: |
          python scripts/update_weekly_news.py --scheduled
      - name: Publicera alla veckoutgåvor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weekly_news.json
          if ! git diff --cached --quiet; then
            git commit -m "Update synact week digest and archive"
            git pull --rebase
            git push
          fi
