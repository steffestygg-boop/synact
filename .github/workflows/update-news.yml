name: Uppdatera SynAct-nyheter
on:
  schedule:
    - cron: '0 7,8 * * *'
  push:
    branches: [main]
    paths: ['scripts/update_market_data.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - name: Kontrollera klockan i Stockholm
        id: stockholm_time
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ] || [ "$(TZ=Europe/Stockholm date +%H)" = "09" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.stockholm_time.outputs.run == 'true'
        uses: actions/checkout@v4
      - if: steps.stockholm_time.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: steps.stockholm_time.outputs.run == 'true'
        name: Hämta pressrubriker
        run: |
          python scripts/update_market_data.py
          python scripts/update_news.py
      - if: steps.stockholm_time.outputs.run == 'true'
        name: Uppdatera Senaste veckan och månadshistorik
        run: python scripts/update_weekly_news.py
      - if: steps.stockholm_time.outputs.run == 'true'
        name: Spara nytt dataflöde
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/news.json data/weekly_news.json
          git diff --cached --quiet || (git commit -m "Update SynAct news" && git pull --rebase && git push)
