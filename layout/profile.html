<div class="profile-banner">
  <div class="profile-company">
    <p class="profile-market"><span class="profile-ticker">$ticker</span><span>$exchange</span></p>
    <h1 id="stock-heading" tabindex="-1">$name</h1>
    <p class="profile-description">$description</p>
  </div>
  <div class="profile-quote" aria-label="Senast tillgängliga börskurs för $name">
    <span class="profile-quote-label">Aktiekurs</span>
    <strong class="profile-quote-number" id="$price_id">— <small>kr</small></strong>
    <span class="profile-asof" id="$status_id">Hämtar senast publicerade kurs …</span>
    <a href="$quote_url" rel="noopener noreferrer" target="_blank">Jämför på TradingView <span class="external-arrow" aria-hidden="true"></span></a>
  </div>
</div>
